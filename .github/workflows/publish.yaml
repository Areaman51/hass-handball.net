name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  release_zip_file:
    name: Run automations to build latest release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛍️ Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🐍 Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: 🤐 Update manifest and build release ZIP
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python "$GITHUB_WORKSPACE/scripts/release_package.py"

      - name: ☁️ Upload zip to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: ${{ github.event_name == 'release' }}
        with:
          files: "${{ github.workspace }}/custom_components/handballnet/handballnet.zip"
